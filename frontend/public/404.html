<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // SPA GitHub Pages redirect - standard approach
    // Redirects to basePath with the intended route in query string as 'route' param
    (function(l) {
      var basePath = '/Scout.io'; // GitHub Pages repo name
      var fullPath = l.pathname;
      
      // Check if this is a 404 for a route under our basePath
      if (fullPath.indexOf(basePath) === 0 && fullPath.length > basePath.length) {
        var routePath = fullPath.slice(basePath.length);
        // Redirect to basePath with the route in the query string as 'route' param
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + basePath + '/?route=' + encodeURIComponent(routePath) + l.hash);
      }
    }(window.location));
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
