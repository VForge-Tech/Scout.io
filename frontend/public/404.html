<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // SPA GitHub Pages redirect
    // Stores the intended path and redirects to base with a marker
    (function(l) {
      if (l.search[1] === '/' && l.search.slice(1).split('/').length > 1) {
        const path = l.pathname.slice(1).replace(/%2F/g, '/');
        const search = l.search.slice(1).replace(/%2F/g, '/');
        const redirectData = { path, search, hash: l.hash };
        sessionStorage.setItem('spa-github-pages-redirect', JSON.stringify(redirectData));
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.slice(0, l.pathname.lastIndexOf('/')) + '/?' + search + l.hash);
      }
    }(window.location));
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
