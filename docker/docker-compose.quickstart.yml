# ─── Scout.io Quick-Start ────────────────────────────────────────────────────
# Minimal service set for a fast local demo with Docker.
#
#   docker compose -f docker/docker-compose.quickstart.yml --profile quick-start up -d --build
#
# Includes: Postgres (with pgvector), Redis, backend API, Celery worker, and the
# Next.js dashboard. Deliberately EXCLUDES Vault, Qdrant, Ollama, and the
# reranker: quick-start uses the pgvector fallback store and plain env vars.
#
# Why Redis stays in the profile: knowledge-source ingestion is dispatched via
# Celery (broker = Redis). Dropping Redis would silently break background sync,
# so it is kept and documented instead of shipping a profile that looks fine but
# never indexes anything.
#
# Overridable via a docker/.env next to this file (or shell env vars), e.g.:
#   POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB / JWT_SECRET / MOCK_LLM

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["quick-start"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-scout}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scout} -d ${POSTGRES_DB:-scout}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["quick-start"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    profiles: ["quick-start"]
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DEPLOYMENT_ENV: development
      DEPLOYMENT_PROFILE: quick-start
      DATABASE_URL: postgresql://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-scout}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      QDRANT_ENABLED: "false"
      PGVECTOR_ENABLED: "true"
      CELERY_ENABLED: "true"
      MOCK_LLM: ${MOCK_LLM:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-quickstart-secret-change-me-please-123456}
      JWT_EXPIRATION_MINUTES: "1440"
      BILLING_ENABLED: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    profiles: ["quick-start"]
    command: celery -A app.tasks.embedding_tasks.celery_app worker --loglevel=info
    environment:
      DEPLOYMENT_ENV: development
      DEPLOYMENT_PROFILE: quick-start
      DATABASE_URL: postgresql://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-scout}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      QDRANT_ENABLED: "false"
      PGVECTOR_ENABLED: "true"
      CELERY_ENABLED: "true"
      MOCK_LLM: ${MOCK_LLM:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-quickstart-secret-change-me-please-123456}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    profiles: ["quick-start"]
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: