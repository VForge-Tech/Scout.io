# Alertmanager configuration.
#
# The Slack webhook is read from /etc/alertmanager/slack_webhook (written at
# container startup from the SLACK_WEBHOOK_URL env var, see docker-compose).
# Alertmanager does not expand ${VAR} placeholders in config files, so the
# secret is passed via the *_file variant instead of being embedded here.
#
# Each notification includes the Grafana dashboard links (from the alert
# annotations in docker/prometheus/alerts.yml) so an on-call engineer can jump
# straight from the alert to the relevant dashboards, and from the request
# dashboard to the trace_id-scoped Loki logs (the per-request grafana_link
# field emitted by the backend's JSON logger).
#
# Swap Slack for PagerDuty later:
#   - Create a service integration key, then add a receiver:
#       - name: pagerduty
#         pagerduty_configs:
#           - service_key: /etc/alertmanager/pagerduty_key
#             severity: critical
#   - Set the `routes[].receiver` for the matching alert to `pagerduty`, or add
#     PagerDuty alongside Slack in the receiver chain (slack_configs +
#     pagerduty_configs in one receiver).

global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/slack_webhook

route:
  receiver: slack-default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: slack-critical
      continue: true
    - match:
        alertname: APIErrorRateHigh
      receiver: slack-critical
    - match:
        alertname: DependencyDown
      receiver: slack-critical
    - match:
        alertname: CeleryQueueGrowing
      receiver: slack-warning
    - match:
        alertname: CeleryTaskFailureRateHigh
      receiver: slack-warning

receivers:
  - name: slack-default
    slack_configs:
      - channel: "#alerts"
        title: '{{ template "scout.title" . }}'
        text: '{{ template "scout.text" . }}'

  - name: slack-critical
    slack_configs:
      - channel: "#alerts"
        title: '{{ template "scout.title" . }}'
        text: '{{ template "scout.text" . }}'

  - name: slack-warning
    slack_configs:
      - channel: "#alerts"
        title: '{{ template "scout.title" . }}'
        text: '{{ template "scout.text" . }}'

templates:
  - "/etc/alertmanager/template.tmpl"