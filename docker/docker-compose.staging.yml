# Staging environment for Scout.io
#
# Based on docker-compose.prod.yml but fully self-contained: it runs its own
# Postgres / Redis / Qdrant / Vault instances with separate volumes and a
# staging-only subdomain, so staging NEVER touches production data or secrets.
#
# Backend runs with DEPLOYMENT_ENV=staging, which makes the secret manager read
# from Vault path secret/scout-io/staging/*. Vault is NOT required for staging
# (only production enforces it), so the compose also passes the key connection
# URLs directly as env vars — the backend falls back to these if a secret is
# missing from Vault.
#
# Secrets to provision in the staging Vault (see docs/staging.md):
#   secret/scout-io/staging/database_url
#   secret/scout-io/staging/redis_url
#   secret/scout-io/staging/qdrant_url
#   secret/scout-io/staging/qdrant_api_key
#   secret/scout-io/staging/jwt_secret
#   secret/scout-io/staging/celery_broker_url
#   secret/scout-io/staging/celery_result_backend
#   secret/scout-io/staging/razorpay_key_id       (staging/test keys)
#   secret/scout-io/staging/razorpay_key_secret
#   secret/scout-io/staging/razorpay_webhook_secret

services:
  vault:
    image: hashicorp/vault:1.15
    environment:
      VAULT_LOCAL_CONFIG: '{"backend": {"file": {"path": "/vault/file"}}, "listener": {"tcp": {"address": "0.0.0.0:8200", "tls_disable": true}}}'
      VAULT_API_ADDR: "http://vault:8200"
      VAULT_CLUSTER_ADDR: "https://vault:8201"
    cap_add:
      - IPC_LOCK
    volumes:
      - staging_vault_data:/vault/file
      - staging_vault_logs:/vault/logs
    restart: always
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${STAGING_POSTGRES_USER:-scout}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:-staging-changeme}
      POSTGRES_DB: ${STAGING_POSTGRES_DB:-scout_staging}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_POSTGRES_USER:-scout} -d ${STAGING_POSTGRES_DB:-scout_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - staging_qdrant_data:/qdrant/storage
    restart: always

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ghcr.io/${IMAGE_NAMESPACE:-scout-io}/backend:${IMAGE_TAG:-latest}
    environment:
      - DEPLOYMENT_ENV=staging
      - DEBUG=false
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${STAGING_VAULT_TOKEN:-staging-root-token}
      # Env fallbacks used when a secret isn't in Vault (Vault not required in staging)
      - DATABASE_URL=postgresql://${STAGING_POSTGRES_USER:-scout}:${STAGING_POSTGRES_PASSWORD:-staging-changeme}@postgres:5432/${STAGING_POSTGRES_DB:-scout_staging}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - JWT_SECRET=${STAGING_JWT_SECRET:-staging-jwt-secret-min-32-chars-long!!}
      - BILLING_ENABLED=true
      - CORS_ORIGINS=${STAGING_CORS_ORIGINS:-["https://staging.scout.io"]}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      vault:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${STAGING_API_URL:-https://staging.scout.io}
        NEXT_PUBLIC_WS_URL: ${STAGING_WS_URL:-wss://staging.scout.io/ws}
    image: ghcr.io/${IMAGE_NAMESPACE:-scout-io}/frontend:${IMAGE_TAG:-latest}
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "${STAGING_HTTP_PORT:-8080}:80"
      - "${STAGING_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: always

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ghcr.io/${IMAGE_NAMESPACE:-scout-io}/backend:${IMAGE_TAG:-latest}
    command: celery -A app.tasks.embedding_tasks.celery_app worker --loglevel=info
    environment:
      - DEPLOYMENT_ENV=staging
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${STAGING_VAULT_TOKEN:-staging-root-token}
      - DATABASE_URL=postgresql://${STAGING_POSTGRES_USER:-scout}:${STAGING_POSTGRES_PASSWORD:-staging-changeme}@postgres:5432/${STAGING_POSTGRES_DB:-scout_staging}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  celery_billing_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ghcr.io/${IMAGE_NAMESPACE:-scout-io}/backend:${IMAGE_TAG:-latest}
    command: celery -A app.tasks.billing_tasks.celery_app worker --loglevel=info
    environment:
      - DEPLOYMENT_ENV=staging
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${STAGING_VAULT_TOKEN:-staging-root-token}
      - DATABASE_URL=postgresql://${STAGING_POSTGRES_USER:-scout}:${STAGING_POSTGRES_PASSWORD:-staging-changeme}@postgres:5432/${STAGING_POSTGRES_DB:-scout_staging}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ghcr.io/${IMAGE_NAMESPACE:-scout-io}/backend:${IMAGE_TAG:-latest}
    command: celery -A app.tasks.analytics_tasks.celery_app beat --loglevel=info
    environment:
      - DEPLOYMENT_ENV=staging
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${STAGING_VAULT_TOKEN:-staging-root-token}
      - DATABASE_URL=postgresql://${STAGING_POSTGRES_USER:-scout}:${STAGING_POSTGRES_PASSWORD:-staging-changeme}@postgres:5432/${STAGING_POSTGRES_DB:-scout_staging}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: always

  celery_billing_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ghcr.io/${IMAGE_NAMESPACE:-scout-io}/backend:${IMAGE_TAG:-latest}
    command: celery -A app.tasks.billing_tasks.celery_app beat --loglevel=info
    environment:
      - DEPLOYMENT_ENV=staging
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${STAGING_VAULT_TOKEN:-staging-root-token}
      - DATABASE_URL=postgresql://${STAGING_POSTGRES_USER:-scout}:${STAGING_POSTGRES_PASSWORD:-staging-changeme}@postgres:5432/${STAGING_POSTGRES_DB:-scout_staging}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: always

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_qdrant_data:
  staging_vault_data:
  staging_vault_logs: