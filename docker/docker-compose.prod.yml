services:
  vault:
    image: hashicorp/vault:1.15
    environment:
      VAULT_LOCAL_CONFIG: '{"backend": {"file": {"path": "/vault/file"}}, "listener": {"tcp": {"address": "0.0.0.0:8200", "tls_disable": true}}}'
      VAULT_API_ADDR: "http://vault:8200"
      VAULT_CLUSTER_ADDR: "https://vault:8201"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
      - vault_logs:/vault/logs
    restart: always
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    restart: always
    environment:
      - DEBUG=false
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    depends_on:
      vault:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../frontend/.env
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: always

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.embedding_tasks.celery_app worker --loglevel=info
    env_file:
      - ../backend/.env
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
    depends_on:
      - redis
      - postgres
      - vault
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  celery_billing_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.billing_tasks.celery_app worker --loglevel=info
    env_file:
      - ../backend/.env
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
    depends_on:
      - redis
      - postgres
      - vault
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.analytics_tasks.celery_app beat --loglevel=info
    env_file:
      - ../backend/.env
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
    depends_on:
      - redis
      - postgres
      - vault
        condition: service_healthy
    restart: always

  celery_billing_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.billing_tasks.celery_app beat --loglevel=info
    env_file:
      - ../backend/.env
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
    depends_on:
      - redis
      - postgres
      - vault
        condition: service_healthy
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["full"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  ollama:
    image: ollama/ollama:latest
    profiles: ["full", "ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  pgvector:
    image: pgvector/pgvector:pg16
    profiles: ["full", "pgvector"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-scout}
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: always

volumes:
  qdrant_data:
  ollama_data:
  pgvector_data:
  vault_data:
  vault_logs:
