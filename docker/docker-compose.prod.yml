services:
  vault:
    image: hashicorp/vault:1.15
    environment:
      VAULT_LOCAL_CONFIG: '{"backend": {"file": {"path": "/vault/file"}}, "listener": {"tcp": {"address": "0.0.0.0:8200", "tls_disable": true}}}'
      VAULT_API_ADDR: "http://vault:8200"
      VAULT_CLUSTER_ADDR: "https://vault:8201"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
      - vault_logs:/vault/logs
    restart: always
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    restart: always
    labels:
      - logging=promtail
    environment:
      - DEBUG=false
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    depends_on:
      vault:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    labels:
      - logging=promtail
    env_file:
      - ../frontend/.env
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: always

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.embedding_tasks.celery_app worker --loglevel=info
    env_file:
      - ../backend/.env
    labels:
      - logging=promtail
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  celery_billing_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.billing_tasks.celery_app worker --loglevel=info
    env_file:
      - ../backend/.env
    labels:
      - logging=promtail
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.analytics_tasks.celery_app beat --loglevel=info
    env_file:
      - ../backend/.env
    labels:
      - logging=promtail
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: always

  celery_billing_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.billing_tasks.celery_app beat --loglevel=info
    env_file:
      - ../backend/.env
    labels:
      - logging=promtail
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["full"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  # ─── Backup / disaster recovery ───────────────────────────────────────────
  # Nightly pg_dump + Qdrant snapshot uploaded to S3-compatible object storage.
  # Runs a backup at startup and then on CRON_SCHEDULE (default 03:00 UTC).
  # Object-store creds come from docker/.env (S3_ENDPOINT/S3_BUCKET/S3_ACCESS_KEY/
  # S3_SECRET_KEY). See docs/disaster-recovery.md.
  backup:
    build:
      context: ../docker/backup
      dockerfile: Dockerfile
    profiles: ["full"]
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PREFIX=${S3_PREFIX:-scout-backups}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-scout}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-scout}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-scout_knowledge}
      - CRON_SCHEDULE=${BACKUP_CRON_SCHEDULE:-0 3 * * *}
      - BACKUP_ON_START=${BACKUP_ON_START:-false}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: always

  ollama:
    image: ollama/ollama:latest
    profiles: ["full", "ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  pgvector:
    image: pgvector/pgvector:pg16
    profiles: ["full", "pgvector"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-scout}
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: always

  # ─── Observability stack ────────────────────────────────────────────────
  # Prometheus scrapes the backend /metrics endpoint (JSON logs are already
  # shipped to Loki by promtail). Grafana is provisioned from docker/grafana/.
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    depends_on:
      - backend
    restart: always

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://grafana:3000}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: always

  loki:
    image: grafana/loki:3.1.0
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    restart: always

  promtail:
    image: grafana/promtail:3.1.0
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    restart: always

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/template.tmpl:/etc/alertmanager/template.tmpl:ro
      - alertmanager_data:/alertmanager
    command:
      - /bin/sh
      - -c
      - 'test -n "$SLACK_WEBHOOK_URL" && printf "%s" "$SLACK_WEBHOOK_URL" > /etc/alertmanager/slack_webhook || echo "SLACK_WEBHOOK_URL not set; Slack notifications disabled" >&2; exec alertmanager --config.file=/etc/alertmanager/alertmanager.yml --log.level=debug'
    restart: always

volumes:
  qdrant_data:
  ollama_data:
  pgvector_data:
  vault_data:
  vault_logs:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:
