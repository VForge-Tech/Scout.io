# Scratch disaster-recovery test environment (NOT for production).
#
# Postgres + Qdrant (the two datastores DR restores) plus MinIO standing in for
# S3-compatible object storage (S3_ENDPOINT=http://minio:9000, path-style).
#
# Used by scripts/restore.sh --compose-file docker/docker-compose.scratch.yml
# and the docs/disaster-recovery.md RTO test procedure.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: scout
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scoutbackup
      MINIO_ROOT_PASSWORD: scoutbackup-secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    image: scout-backup:latest
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=scout-backups
      - S3_ACCESS_KEY=scoutbackup
      - S3_SECRET_KEY=scoutbackup-secret
      - S3_REGION=us-east-1
      - S3_PREFIX=scout-backups
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=scout
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=scout
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=scout_knowledge
      - BACKUP_ON_START=false
      - CRON_SCHEDULE=0 3 * * *
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  minio_data: