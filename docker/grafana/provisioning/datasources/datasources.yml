apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: scout-prom
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    uid: scout-loki
    url: http://loki:3100
    jsonData:
      maxLines: 1000
    editable: false