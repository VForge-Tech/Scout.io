version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: scout_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scout_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scout_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-scout_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scout_user} -d ${POSTGRES_DB:-scout_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scout_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: scout_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scout_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env.example # fallback, overridden if local .env exists
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-scout_user}:${POSTGRES_PASSWORD:-scout_secure_password}@db:5432/${POSTGRES_DB:-scout_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scout_celery_worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-scout_user}:${POSTGRES_PASSWORD:-scout_secure_password}@db:5432/${POSTGRES_DB:-scout_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scout_frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.example
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
