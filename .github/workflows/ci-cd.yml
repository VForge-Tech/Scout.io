name: Scout.io CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff (Lint & Format)
        run: |
          ruff check backend
          ruff format --check backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Prettier (Format Check)
        run: |
          cd frontend
          npm run format:check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest
        run: |
          cd backend
          pytest tests/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Run Frontend Vitest
        run: |
          cd frontend
          npm run test

  security-scanning:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0' # set to 1 if you want to fail build on vulns
          severity: 'CRITICAL,HIGH'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python dependencies using Safety
        run: |
          pip install safety
          safety check -r backend/requirements.txt || true # Don't block build if databases are slightly outdated in mock

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-format, unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Dummy .env file
        run: |
          cp .env.example .env

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build & Run Docker Compose Services
        run: |
          docker-compose up -d --build

      - name: Wait for Services (Health Checks)
        run: |
          echo "Waiting for services to boot..."
          sleep 15
          docker-compose ps

      - name: Verify Backend Endpoint
        run: |
          curl -f http://localhost:8000/healthz

      - name: Run Integration API verification
        run: |
          # Verify root endpoint
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/)
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "API server root test failed: status code $STATUS_CODE"
            exit 1
          fi
          echo "API server is running successfully!"

      - name: Shut down Docker Compose
        if: always()
        run: |
          docker-compose down -v

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [lint-format, unit-tests, security-scanning, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
